<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mẫu icon Sổ Thu Chi</title>
<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#1a1d23;--muted:#6b7280;--line:#e5e7eb}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1115;--card:#181b21;--text:#e8eaed;--muted:#9aa1ab;--line:#2a2e36}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:21px;margin:4px 0}p{color:var(--muted);margin:4px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center}
.card h3{margin:10px 0 2px;font-size:15px}.card small{color:var(--muted)}
.big{width:132px;height:132px;border-radius:30px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.row{display:flex;justify-content:center;gap:14px;margin-top:12px}
.home{border-radius:14px;padding:12px 10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;width:92px}
.home.l{background:linear-gradient(160deg,#c7d2fe,#fbcfe8);color:#111}.home.d{background:linear-gradient(160deg,#1e1b4b,#111827);color:#fff}
.home img{width:56px;height:56px}.ios{border-radius:13px}.and{border-radius:50%}
.num{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--text);color:var(--bg);font-weight:700;font-size:13px}
</style></head><body><main>
<h1>Mẫu icon cho Sổ Thu Chi</h1>
<p>Mỗi mẫu xem ở cỡ lớn, trên màn hình iPhone (góc bo) và Android (hình tròn), nền sáng lẫn nền tối.</p>
<div class="grid" id="g"></div>
</main>
<script>
const I=[['1-so-tay','Sổ tay ₫','Xanh ngọc, hợp giao diện mặc định'],['2-vi-tien','Ví tiền','Xanh dương, ví có đồng xu'],['3-tang-truong','Tăng trưởng','Xanh lá, cột và mũi tên đi lên'],
 ['4-heo-dat','Heo đất','Hồng, heo đất tiết kiệm'],['5-lich-thu-chi','Lịch thu chi','Cam, tờ lịch có dấu + và −'],['6-neon-dem','Neon đêm','Đen, ₫ phát sáng, hợp Đêm OLED']];
document.getElementById('g').innerHTML=I.map(([f,n,d],i)=>`<div class="card"><img class="big" src="${f}.svg" alt="Icon ${n}">
 <h3><span class="num">${i+1}</span> ${n}</h3><small>${d}</small>
 <div class="row"><div class="home l"><img class="ios" src="${f}.svg" alt="">Thu Chi</div><div class="home d"><img class="and" src="${f}.svg" alt="">Thu Chi</div></div></div>`).join('');
</script></body></html>

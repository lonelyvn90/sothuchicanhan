<style>
:root{--bg:#f3f4f6;--card:#fff;--text:#1a1d23;--muted:#6b7280;--line:#e5e7eb;--accent:#0f766e;--accent-soft:#e3f3f0;--on-accent:#fff;--red:#dc2626;--green:#15803d;--amber-soft:#fdf3e2;--amber:#ca8a04;--orange:#ea580c}
:root[data-mode=dark]{--bg:#0f1115;--card:#181b21;--text:#e8eaed;--muted:#9aa1ab;--line:#2a2e36;--accent:#2dd4bf;--accent-soft:#12302c;--on-accent:#06201c;--red:#f87171;--green:#4ade80;--amber-soft:#2e2410;--amber:#fbbf24;--orange:#fb923c;color-scheme:dark}
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.th{display:flex;flex-direction:column;gap:5px;align-items:center;font-size:12.5px;padding:6px;border-radius:14px;border:2px solid transparent}
.th.on{border-color:var(--accent);font-weight:700}
.th .pv{width:100%;aspect-ratio:1.1;border-radius:10px;padding:8px;border:1px solid var(--line);display:flex;align-items:flex-end}
.th .pc{width:100%;border-radius:7px;border:1px solid;padding:6px;display:flex;flex-direction:column;gap:4px}
.th .pc i{display:block;height:7px;border-radius:4px}.th .pc i:first-child{width:70%}.th .pc i:last-child{width:100%;height:12px}
.seg button:disabled{opacity:.35}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}
h1{font-size:21px;margin:4px 0}h3{font-size:15px;margin:0 0 8px}
.muted{color:var(--muted)}.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
input,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none;min-width:0}
input:focus,select:focus{border-color:var(--accent)}
label{display:block;font-size:12.5px;color:var(--muted);margin-top:8px}label input,label select{margin-top:3px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.primary{background:var(--accent);color:var(--on-accent);font-weight:600;border-radius:12px;padding:13px;width:100%;font-size:16px}
.ghost{border:1px dashed var(--line);border-radius:12px;padding:10px;color:var(--accent);font-weight:600;width:100%;margin-top:8px}
.outline{border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-weight:600}
.link{color:var(--muted);font-size:14px;text-decoration:underline;padding:8px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row-edit{position:relative;border-top:1px solid var(--line);padding:12px 30px 12px 0}.row-edit:first-of-type{border-top:0;padding-top:0}
.x{position:absolute;right:0;top:12px;width:26px;height:26px;color:var(--muted)}.row-edit:first-of-type .x{top:0}
.head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.head .nav{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:20px}
.head .nav:disabled{opacity:.3}
.head .mid{text-align:center}.head .mid b{display:block;font-size:17px}.head .mid small{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:8px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amt{display:flex;align-items:center;gap:6px;margin:12px 0 6px}
.amt input{font-size:30px;font-weight:700;text-align:right;padding:8px 12px;background:transparent;border:0;border-bottom:2px solid var(--line);border-radius:0}
.amt input:focus{border-color:var(--accent)}.amt span{font-size:22px;color:var(--muted);font-weight:600}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 4px}
.chip{border:1px solid var(--line);border-radius:12px;padding:8px 2px;font-size:12.5px;background:var(--card);display:flex;flex-direction:column;align-items:center;gap:2px}
.chip span{font-size:20px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.sugs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-top:12px}
.sug{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13.5px;background:var(--card)}
.list{margin:0;padding:0;list-style:none}
.tx{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}.tx:first-child{border-top:0}
.tx .ic{font-size:20px;width:28px;text-align:center;flex:none}
.tx .bd{flex:1;min-width:0}.tx .bd b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .bd small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .am{font-weight:700;white-space:nowrap}.in{color:var(--green)}.out{color:var(--red)}.mv{color:var(--muted)}
.tx .del{color:var(--muted);width:28px;height:28px;flex:none}
.tx.editing{background:var(--accent-soft);margin:0 -14px;padding:10px 14px}
.due{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.due:first-of-type{border-top:0}
.due .bd{flex:1;min-width:0}.due .bd b{display:block;font-size:14px}.due .bd small{color:var(--muted)}
.due input{width:115px;text-align:right;padding:7px 8px;font-size:15px}
.due button{background:var(--accent);color:var(--on-accent);border-radius:9px;padding:8px 10px;font-weight:600;font-size:13px;white-space:nowrap}
.late{color:var(--red);font-weight:600}
.card.warn{border-color:var(--amber);background:var(--amber-soft)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line)}.kv:first-of-type{border-top:0}
.kv b{font-weight:700;white-space:nowrap}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stats3 small{color:var(--muted);display:block;font-size:12px}.stats3 b{font-size:16px}
.big{font-size:28px;font-weight:800;margin:2px 0}
.bar{height:7px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.cat{padding:8px 0;border-top:1px solid var(--line)}.cat:first-of-type{border-top:0}.cat .t{display:flex;justify-content:space-between}
.btnrow{display:flex;gap:8px;margin-top:10px}.btnrow>*{flex:1}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs .in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{font-size:11px!important;white-space:nowrap}
.week{display:flex;gap:3px;align-items:stretch;margin-bottom:12px}
.week .wk{width:22px;color:var(--muted);font-size:19px;flex:none}.week .wk:disabled{opacity:.25}
.wd{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.wd small{font-size:11px;color:var(--muted)}.wd b{font-size:15.5px}
.wd i{width:5px;height:5px;border-radius:50%}.wd i.dot{background:var(--accent)}
.wd.today{border-color:var(--accent);color:var(--accent)}
.wd.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}.wd.on small{color:inherit;opacity:.85}.wd.on i.dot{background:var(--on-accent)}
.wd:disabled{opacity:.35}
@keyframes inL{from{transform:translateX(36px);opacity:.3}to{transform:none;opacity:1}}
@keyframes inR{from{transform:translateX(-36px);opacity:.3}to{transform:none;opacity:1}}
#app.sl{animation:inL .22s ease-out}#app.sr{animation:inR .22s ease-out}
@media (prefers-reduced-motion:reduce){#app.sl,#app.sr{animation:none}}
.icbtns{display:flex;gap:8px}
.icbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:18px;display:grid;place-items:center}
/* Form ghi sổ: mỗi loại một màu riêng */
.m-expense{--mc:var(--red)}.m-income{--mc:var(--green)}.m-transfer{--mc:#3b82f6}
.mseg{margin-top:12px}.mseg button.on{background:var(--mc);color:#fff;box-shadow:none}
.eform{border:2px solid var(--mc);border-top-width:6px;margin-top:8px}
.ftitle{font-weight:800;font-size:16px;color:var(--mc);margin-bottom:4px}
.fsec{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}.ftitle+.fsec{border-top:0;margin-top:2px;padding-top:2px}
.flabel{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.fsec label{margin-top:0}.fsec .grid2 label{margin-top:0}
.eform .amt{margin:2px 0 0}.eform .amt .sign{font-size:30px;font-weight:800;color:var(--mc);min-width:14px}
.eform .amt input{color:var(--mc);border-bottom-color:var(--mc)}
.eform .chip.on{background:color-mix(in srgb,var(--mc) 14%,var(--card));border-color:var(--mc);color:var(--mc)}
.eform .msave{background:var(--mc);color:#fff}
.tgroup{border-left:4px solid var(--line)}.g-expense{border-left-color:var(--red)}.g-income{border-left-color:var(--green)}.g-other{border-left-color:#3b82f6}
.tgroup h3{margin:0}
.cardel{margin-left:auto;color:var(--muted);font-size:13px;width:26px;height:26px}
.yrIn{width:100%;text-align:right;padding:4px 6px;margin:0 0 2px;font-size:13px;background:var(--card)}
.caradd{display:flex;gap:8px;margin-top:10px}.caradd input{flex:1}.caradd button{flex:none}
.frow{border-top:1px solid var(--line);padding:9px 0}.frow:first-of-type{border-top:0}
.fhead{display:flex;align-items:baseline;gap:6px;margin-bottom:6px}.fhead span{font-size:18px}.fhead small{margin-left:auto;font-size:11.5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fcell{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg)}
.fcell.cheap{border-color:var(--green);background:color-mix(in srgb,var(--green) 10%,var(--bg))}
.fst{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;color:var(--muted)}
.fst a{color:var(--accent);text-decoration:none;font-size:15px;padding:0 4px}
.fcell input{width:100%;text-align:right;padding:5px 6px;margin:3px 0 2px;font-size:15px;background:var(--card)}
.fcell small{font-size:11px;display:block;text-align:right}
/* Màn Sửa thiết lập: mỗi mục một màu, mỗi khoản một thẻ */
.s-acc{--sc:#3b82f6}.s-loan{--sc:#a855f7}.s-exp{--sc:var(--red)}.s-inc{--sc:var(--green)}
.snav{display:flex;gap:6px;overflow-x:auto;margin-top:12px;padding-bottom:2px;scrollbar-width:none}
.snav button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:13px;background:var(--card)}
.ssec{margin-top:20px;scroll-margin-top:12px}
.shead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;font-weight:800;font-size:15.5px;color:var(--sc);
  background:color-mix(in srgb,var(--sc) 13%,var(--card));border:1px solid color-mix(in srgb,var(--sc) 40%,var(--line))}
.shead small{margin-left:auto;font-weight:600;font-size:12px;color:var(--muted)}
.ecard{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:14px;padding:12px;margin-top:10px}
.ehead{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.enum{width:24px;height:24px;border-radius:50%;background:var(--sc);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.ehead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ehead small{color:var(--muted);font-size:12px;white-space:nowrap}
.edel{color:var(--red);font-size:12px;border:1px solid var(--line);border-radius:8px;width:30px;height:30px;flex:none}
/* Ô icon trong tab Tài khoản rộng bằng nhau để thanh số tiền thẳng hàng */
.arow .aic{width:62px;height:38px;flex:none}.arow .aic .logo{width:38px;height:38px}
.xmgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.xmc{border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:2px;min-width:0;background:var(--card)}
.xmc.open{grid-column:1/-1}
.xmimg{display:block;background:#fff;border-radius:9px;aspect-ratio:4/3;overflow:hidden;margin-bottom:4px}
.xmimg img{width:100%;height:100%;object-fit:contain;display:block}
.xmc.open .xmimg{aspect-ratio:16/9}
.xmn{font-size:14px;line-height:1.25}.xmc small{font-size:11.5px}
.xmp{font-weight:800;color:var(--accent);font-size:15px}.xmp small{font-weight:600;color:var(--muted)}
.xmv{align-self:flex-start;font-size:12px;color:var(--accent);padding:3px 0;font-weight:600}
.xmvars{border-top:1px solid var(--line);margin-top:4px}
.xmvar{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.xmvar span{display:flex;flex-direction:column;min-width:0}.xmvar small{color:var(--muted)}.xmvar>b{white-space:nowrap}
.bbsum{font-size:13px;color:var(--muted);margin:2px 0 8px}
.bbset{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);margin-bottom:8px}
.bbset .fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:8px}.bbset .fl input,.bbset .fl select{margin-top:3px}
.bbbrands{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.bbbrands .chip{padding:6px 10px;font-size:13px}
.bbrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);color:inherit;text-decoration:none}
.bbic{font-size:20px}.bbn{flex:1;min-width:0;display:flex;flex-direction:column}.bbn small{color:var(--muted);font-size:12px}
.bbgo{color:var(--accent);font-weight:700;font-size:13.5px;border:1px solid var(--accent);border-radius:9px;padding:6px 10px;white-space:nowrap}
.cardet summary{cursor:pointer;list-style:none}.cardet summary::-webkit-details-marker{display:none}.cardet summary::after{content:' ▸';color:var(--muted)}.cardet[open] summary::after{content:' ▾'}
.acctool{margin:0 0 4px}.acctool button{color:var(--accent)}.acctool button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.draghint{margin:2px 0 4px}.notot{color:var(--muted);font-style:italic}
.dhandle{flex:none;width:34px;height:42px;display:grid;place-items:center;font-size:22px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:8px;background:var(--bg)}
.arow.drag{background:var(--card)}.arow.dragging{opacity:.92;box-shadow:0 6px 18px rgba(0,0,0,.35);border-radius:12px;position:relative;z-index:3;outline:2px solid var(--accent)}
.arow.dragging .dhandle{cursor:grabbing;color:var(--accent)}
.pdform{border:1.5px solid var(--mc,var(--accent));border-radius:12px;padding:10px;margin:8px 0;background:var(--bg)}
.pdform .seg button.on{background:var(--mc,var(--accent));color:#fff}
.pdform .fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:8px}.pdform .fl input,.pdform .fl select{margin-top:3px}
.pdsec{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;margin:12px 0 2px}.pdsec.out{color:var(--red)}.pdsec.in{color:var(--green)}
.pdrow{padding:9px 0;border-top:1px solid var(--line)}.pdrow .ch{align-items:flex-start}.pdrow.done{opacity:.7}
.pdt{display:flex;flex-direction:column;min-width:0}.pdt small{font-size:12px;color:var(--muted)}
.pdrow .bar{height:5px;margin:5px 0 2px}
.pddone summary{cursor:pointer;color:var(--muted);font-size:13px;margin-top:10px}
.plan{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:5px 8px;flex:none;white-space:nowrap}
.card.fut{border-style:dashed}
.ehead{cursor:pointer}.ett{flex:1;min-width:0;display:flex;flex-direction:column}.ett b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ett small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emove{display:flex;gap:4px;flex:none}.emove button{width:30px;height:30px;border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--muted)}
.echev{width:16px;text-align:center;color:var(--muted);flex:none}
.ecard.closed{padding:9px 12px}.ecard.closed .ehead{border-bottom:0;padding-bottom:0;margin-bottom:0}
.shead{cursor:pointer}
.stool{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.stool button{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12.5px;background:var(--card);color:var(--sc);font-weight:600}
.ecard .fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-top:9px}
.ecard .fl input,.ecard .fl select{margin-top:3px}
.ecard .brandrow{margin:3px 0 0}
.esub{font-size:11.5px;font-weight:800;color:var(--sc);text-transform:uppercase;letter-spacing:.04em;margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.addbtn{width:100%;margin-top:10px;border:1.5px dashed var(--sc);color:var(--sc);border-radius:12px;padding:10px;font-weight:700;background:transparent}
.savebar{position:sticky;bottom:0;z-index:4;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom));margin-top:16px;display:flex;gap:8px;border-top:1px solid var(--line)}
.savebar>*{flex:1}
.dbox{margin-top:7px;background:var(--bg);border-radius:10px;padding:7px 9px;font-size:12.5px}
.stline{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 6px;font-size:12.5px;color:var(--text)}
.stline input{width:128px;flex:none;text-align:right;padding:6px 8px;font-size:15px;margin:0;background:var(--card)}
.dline{margin:2px 0}.dline.ok{color:var(--green)}.dline.late{color:var(--red);font-weight:600}
.drow{display:flex;gap:6px;flex-wrap:wrap}.drow .mini{margin-top:5px}
.steps{margin:8px 0;padding-left:20px;font-size:14px}.steps li{margin:4px 0}
button:disabled{opacity:.55}
.mini{margin-top:6px;border:1px solid var(--line);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:600;color:var(--accent);background:var(--card)}
.gear{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-weight:600;font-size:13.5px}
.mrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}h3+.mrow,.hint+.mrow{border-top:0}

.mrow .fuelIn{width:120px;text-align:right;padding:7px 8px}

/* Ghi nhận thay đổi để gộp dữ liệu giữa các máy:

const CFG_KEYS=['setup','startDate','accounts','loans','recurring','quick','fuel','fuelDate','food','cars','carSearch','pdebts','accSort','closed'];

let base=null;
function track(){
  if(!state||!state.tx)return;if(!base){base=snap(state);return}
  const now=Date.now(),ids=new Set();
  if(cfgOf(state)!==base.cfg)state.cfgAt=now;
  for(const t of state.tx){ids.add(t.id);const old=base.tx.get(t.id);if(old!==undefined&&old!==JSON.stringify(t))t.mt=now}
  for(const id of base.tx.keys())if(!ids.has(id))(state.deleted=state.deleted||{})[id]=now;
  base=snap(state);
}
function persist(silent){
  if(silent)base=snap(state);else track();

function mergeStates(a,b){
  if(!a||!a.setup)return b&&b.setup?b:a;if(!b||!b.setup)return a;
  const del=Object.assign({},b.deleted,a.deleted),map=new Map(),v=t=>t.mt||t.ts||0;
  for(const t of b.tx.concat(a.tx)){if(del[t.id])continue;const o=map.get(t.id);if(!o||v(t)>v(o))map.set(t.id,t)}
  const cfg=(a.cfgAt||0)>=(b.cfgAt||0)?a:b;
  return Object.assign({},cfg,{tx:[...map.values()].sort((x,y)=>(x.ts||0)-(y.ts||0)),deleted:del});
}

const toB64=buf=>{const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)};
const fromB64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptState(obj,pass){
  const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},await deriveKey(pass,salt),new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({app:'sothuchi',v:1,salt:toB64(salt),iv:toB64(iv),ct:toB64(ct)});
}
async function decryptState(txt,pass){
  const p=JSON.parse(txt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(p.iv)},await deriveKey(pass,fromB64(p.salt)),fromB64(p.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function ghApi(path,opt){
  opt=opt||{};const h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+sync.token};if(opt.body)h['Content-Type']='application/json';
  const r=await fetch('https://api.github.com'+path,Object.assign({},opt,{headers:h,cache:'no-store'}));
  if(r.status===401)throw new Error('Mã truy cập GitHub sai hoặc đã hết hạn');
  if(r.status===403||r.status===404)throw new Error('Mã truy cập chưa có quyền "gist" hoặc không tìm thấy dữ liệu');
  if(!r.ok)throw new Error('GitHub báo lỗi '+r.status);
  return r.json();
}
async function findGist(){
  for(let p=1;p<=5;p++){const l=await ghApi('/gists?per_page=100&page='+p);const g=l.find(x=>x.description===GIST_DESC&&x.files&&x.files[GIST_FILE]);if(g)return g.id;if(l.length<100)break}
  return null;
}
async function readRemote(){
  const f=(await ghApi('/gists/'+sync.gistId)).files[GIST_FILE];if(!f)return null;
  const txt=f.truncated?await (await fetch(f.raw_url,{cache:'no-store'})).text():f.content;
  try{return await decryptState(txt,sync.pass)}catch(e){throw new Error('Sai mật khẩu mã hóa (phải giống máy đã tạo dữ liệu)')}
}
async function writeRemote(obj){
  const content=await encryptState(obj,sync.pass);
  if(sync.gistId)await ghApi('/gists/'+sync.gistId,{method:'PATCH',body:JSON.stringify({files:{[GIST_FILE]:{content}}})});
  else sync.gistId=(await ghApi('/gists',{method:'POST',body:JSON.stringify({description:GIST_DESC,public:false,files:{[GIST_FILE]:{content}}})})).id;

function scheduleSync(ms){if(!sync)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>syncNow(),ms==null?2500:ms)}
async function syncNow(manual){
  if(!sync)return;if(!navigator.onLine){if(manual)toast('Đang mất mạng, sẽ đồng bộ khi có mạng');return}
  if(syncing){syncAgain=true;return}
  syncing=true;sync.err='';if(ui.view==='settings'||ui.showSync)render();
  try{
    if(!sync.gistId)sync.gistId=await findGist();
    const remote=sync.gistId?await readRemote():null,merged=mergeStates(state,remote);
    if(!merged){if(manual)toast('Chưa có dữ liệu nào để đồng bộ')}
    else{
      const mj=JSON.stringify(merged);
      if(!remote||JSON.stringify(remote)!==mj)await writeRemote(merged);
      if(JSON.stringify(state)!==mj){state=merged;persist(true);if(ui.view==='setup'){ui.view='today';ui.draft=null;ui.showSync=false}render();toast('Đã cập nhật dữ liệu từ máy khác')}
      else if(manual)toast('Đã đồng bộ');
    }
    sync.last=Date.now();
  }catch(e){sync.err=e.message||'Không đồng bộ được';if(manual||!sync.last)toast(sync.err)}
  syncing=false;saveSync();if(ui.view==='settings'||ui.showSync)render();

}

/* Vay nợ cá nhân: state.pdebts=[{id,who,dir:'borrow'|'lend',amount,date,due,note,acc}]

const pdebtsOf=()=>state.pdebts||[];

const loanLeft=l=>Math.max(0,(l.remaining||0)-state.tx.filter(t=>t.ref==='l:'+l.id).length);

/* Khoản hằng tháng tính bằng USD: đổi sang VNĐ theo tỷ giá mới nhất (tab Thị trường) + phí chuyển đổi ngoại tệ của thẻ */
const DEF_FEE=2.5,FALLBACK_RATE=25500;

const feeOf=r=>r.fee==null?DEF_FEE:+r.fee;

const rateFor=r=>usdRate()||r.lastRate||FALLBACK_RATE;
const fmtUsd=n=>(+n).toLocaleString('en-US',{maximumFractionDigits:2})+' USD';

function recAmount(r){return isUsd(r)?Math.round(r.usd*rateFor(r)*(1+feeOf(r)/100)/100)*100:r.amount}

function dueItems(mk){
  const [y,m]=mk.split('-').map(Number),dim=new Date(y,m,0).getDate();
  const at=d=>mk+'-'+String(Math.min(Math.max(d||1,1),dim)).padStart(2,'0');
  const paid=key=>state.tx.find(t=>t.ref===key&&t.date.startsWith(mk));
  const out=[];
  for(const r of state.recurring)out.push({key:'r:'+r.id,name:r.name,amount:recAmount(r),date:at(r.day),acc:r.acc,type:r.type,cat:r.cat,usd:isUsd(r)?r.usd:0,usdNote:isUsd(r)?usdNote(r):''});
  const cm=today().slice(0,7),ahead=(()=>{const [a,b]=cm.split('-').map(Number),[c,e]=mk.split('-').map(Number);return (c-a)*12+(e-b)})();
  for(const l of state.loans){const key='l:'+l.id;
    /* Tháng sau: chỉ hiện nếu còn đủ kỳ tới tháng đó */
    if(ahead>0){const paidCur=state.tx.some(t=>t.ref===key&&t.date.startsWith(cm));if(ahead+(paidCur?0:1)>loanLeft(l))continue}
    if(loanLeft(l)>0||paid(key))out.push({key,name:'Trả góp '+l.name,amount:l.amount,date:at(l.day),acc:l.acc,type:'expense',cat:'Trả góp'})}
  /* Thẻ tín dụng / trả sau: nếu đã nhập số phải trả theo sao kê tháng này thì dùng số đó (trả thiếu vẫn còn nợ phần còn lại),
     chưa nhập thì dùng toàn bộ dư nợ hiện tại */
  for(const a of state.accounts.filter(a=>isDebt(a)&&a.dueDay)){

    if(debt>0||st||pays.length)out.push({key,name:'Trả '+a.name,amount:st?Math.max(0,st-ps):debt,st,ps,date:at(a.dueDay),acc:a.payFrom,toAcc:a.id,type:'transfer',cat:null,

  out.forEach(it=>it.done=it.doneAs!==undefined?it.doneAs:paid(it.key));
  return out.filter(it=>it.date>=state.startDate).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
}

/* ---------- Hằng tháng ---------- */
function fixRow(i){
  const T=today(),r=i.key.startsWith('r:');
  const ic=i.type==='transfer'?'💳':(ICON[i.cat]||'📦');
  const st=i.date.slice(0,7)>T.slice(0,7)?`<span class="plan">Dự kiến</span>`:i.done?`<button class="okb" data-act="undoFix" data-key="${i.key}" title="Bỏ đánh dấu">✓ ${dm(i.done.date)}</button>`
    :`<button class="pay" data-act="payFix" data-key="${i.key}">${i.type==='income'?'Nhận':'Trả'}</button>`;
  return `<div class="fx ${i.done?'done':''}"><div class="ic">${ic}</div><div class="bd" ${r?`data-act="editFix" data-id="${i.key.slice(2)}"`:''}><b>${esc(i.name)}</b><small>Ngày ${+i.date.slice(8)} · ${esc(accName(i.acc))}${!i.done&&i.date<T?' · <span class="late">trễ hạn</span>':''}${i.usd&&!i.done?`<br>💵 ${i.usdNote}`:i.usd&&i.done&&i.done.usd?`<br>💵 ${fmtUsd(i.done.usd)} · ${fmtN(i.done.rate)}đ/USD`:''}</small></div><div class="am ${i.type==='income'?'in':''}">${fmt(i.done?i.done.amount:i.amount)}</div>${st}</div>`;
}
function readFix(){const cur=($('#fxCur')||{}).value||'VND',a=$('#fxAmt').value,fe=$('#fxFee');
  return {name:$('#fxName').value.trim(),cur,amount:cur==='USD'?0:parseAmt(a),usd:cur==='USD'?parseDec(a):0,fee:fe?parseDec(fe.value):feeOf(ui.fix||{}),
    day:Math.min(31,Math.max(1,parseInt($('#fxDay').value)||1)),acc:$('#fxAcc').value,cat:$('#fxCat').value}}
function fixForm(type){

      ${f.cur==='USD'?`<label>Phí ngoại tệ của thẻ (%)<input id="fxFee" inputmode="decimal" value="${fmtDec(feeOf(f))}" placeholder="VD: 2,5"></label>`:'<span></span>'}</div>
    ${f.cur==='USD'?`<p class="hint" style="margin:2px 0 0">Đến hạn, app tự đổi ra VNĐ theo tỷ giá mới nhất cộng phí. Hiện tại: <b>${fmt(recAmount({cur:'USD',usd:f.usd||1,fee:f.fee,lastRate:f.lastRate}))}</b>${f.usd?'':' cho 1 USD'}.</p>`:''}
    <div class="grid2"><label>Ngày trong tháng<input id="fxDay" inputmode="numeric" value="${f.day||''}"></label><label>Danh mục<select id="fxCat">${cats.map(c=>`<option ${c===f.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
    <label>${type==='income'?'Nhận vào':'Trả từ'}<select id="fxAcc">${accOptions(f.acc)}</select></label>
    <div class="btnrow">${f.id?`<button class="outline late" data-act="delFix">Xóa</button>`:''}<button class="outline" data-act="cancelFix">Hủy</button><button class="primary" data-act="saveFix">Lưu</button></div></div>`;
}
function chartHtml(){
  const cm=today().slice(0,7),sm=state.startDate.slice(0,7),data=[];
  for(let j=5;j>=0;j--){const k=addMonths(cm,-j);if(k<sm)continue;const m=state.tx.filter(t=>t.date.startsWith(k));data.push({k,i:sum(m.filter(t=>t.type==='income')),e:sum(m.filter(isSpend))})}
  const max=Math.max(1,...data.map(d=>Math.max(d.i,d.e)));
  const h=v=>v?`max(3px,${v/max*100}%)`:'0';
  return `<div class="legend"><span><i style="background:var(--green)"></i>Thu</span><span><i style="background:var(--red)"></i>Chi</span><small class="muted">Chạm cột để xem tháng</small></div>
  <div class="chart">${data.map(d=>`<button class="col ${d.k===ui.month?'sel':''}" data-act="setMon" data-k="${d.k}" title="${mLabel(d.k)}: Thu ${fmt(d.i)}, Chi ${fmt(d.e)}" aria-label="${mLabel(d.k)}: Thu ${fmt(d.i)}, Chi ${fmt(d.e)}">
    <div class="bars"><i style="height:${h(d.i)};background:var(--green)"></i><i style="height:${h(d.e)};background:var(--red)"></i></div><small>T${+d.k.slice(5)}</small></button>`).join('')}</div>`;
}
function viewMonth(){
  const mk=ui.month,T=today(),cur=mk===T.slice(0,7);
  const mt=state.tx.filter(t=>t.date.startsWith(mk));
  const inc=sum(mt.filter(t=>t.type==='income')),exp=sum(mt.filter(isSpend));
  const by={};mt.filter(isSpend).forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]),max=rows.length?rows[0][1]:1;
  const items=dueItems(mk);ui.fixMap={};items.forEach(i=>ui.fixMap[i.key]=i);
  const outs=items.filter(i=>i.type!=='income'),ins=items.filter(i=>i.type==='income');
  const left=a=>a.filter(i=>!i.done).reduce((s,i)=>s+i.amount,0);
  const fut=mk>T.slice(0,7),maxMk=addMonths(T.slice(0,7),12);

  const pIn=ins.reduce((s,i)=>s+i.amount,0),pOut=outs.filter(i=>i.type==='expense').reduce((s,i)=>s+i.amount,0);
  return `<div class="head"><button class="nav" data-act="mon" data-d="-1" aria-label="Tháng trước">‹</button><div class="mid"><b>${mLabel(mk)}</b>${fut?'<small>Xem trước · dự kiến</small>':cur?'':`<small><a href="#" data-act="monNow" style="color:var(--accent)">Về tháng này</a></small>`}</div><button class="nav" data-act="mon" data-d="1" ${mk>=maxMk?'disabled':''} aria-label="Tháng sau">›</button></div>
  ${fut?`<div class="card fut"><div class="stats3"><div><small>Thu dự kiến</small><b class="in">${fmt(pIn)}</b></div><div><small>Chi cố định</small><b class="out">${fmt(pOut)}</b></div><div><small>Còn lại</small><b>${fmt(pIn-pOut)}</b></div></div>
    <p class="hint" style="text-align:center">Chỉ tính các khoản thu chi cố định và trả góp, chưa gồm chi sinh hoạt hằng ngày và thanh toán thẻ. Xem đầy đủ hơn ở tab Dự báo.</p></div>`
  :`<div class="card"><div class="stats3"><div><small>Thu</small><b class="in">${fmt(inc)}</b></div><div><small>Chi</small><b class="out">${fmt(exp)}</b></div><div><small>Còn lại</small><b>${fmt(inc-exp)}</b></div></div>${chartHtml()}</div>`}
  <div class="card"><div class="ch"><h3>Chi cố định</h3><small class="muted">${outs.length?(left(outs)?'Còn phải trả '+fmt(left(outs)):'Đã trả hết ✓'):''}</small></div>
    ${outs.map(fixRow).join('')||'<div class="empty">Chưa có khoản nào</div>'}${fixForm('expense')}
    ${state.loans.length||state.accounts.some(a=>isDebt(a))?'<p class="hint">Trả góp và thẻ tín dụng sửa ở tab Tài khoản. Chạm tên khoản khác để sửa.</p>':''}</div>
  <div class="card"><div class="ch"><h3>Thu hằng tháng</h3><small class="muted">${ins.length?(left(ins)?'Còn chờ nhận '+fmt(left(ins)):'Đã nhận hết ✓'):''}</small></div>
    ${ins.map(fixRow).join('')||'<div class="empty">Chưa có khoản nào</div>'}${fixForm('income')}</div>
  ${fut?'':`<div class="card"><h3>Chi vào đâu</h3>${rows.length?rows.map(([c,v])=>`<div class="cat"><div class="t"><span>${ICON[c]||'📦'} ${esc(c)}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`).join(''):`<div class="empty">Chưa có khoản chi.</div>`}</div>
  ${interestCard(mk)}`}`;
}
function interestCard(mk){
  const m=interestIn(mk),y=interestIn(mk.slice(0,4)),all=interestIn('');
  const rows=Object.entries(all.by).sort((a,b)=>b[1]-a[1]),max=rows.length?rows[0][1]:1;
  const owe=state.accounts.filter(isDebt).reduce((s,a)=>s+Math.max(0,-bal(a.id))*(a.rate||0)/100,0);
  const loanLeftInt=state.loans.reduce((s,l)=>s+(l.interest||0)*loanLeft(l),0);
  return `<div class="card"><h3>💸 Tiền lãi & phí đã trả</h3>
    <div class="stats3"><div><small>${mLabel(mk)}</small><b class="out">${fmt(m.total)}</b></div><div><small>Năm ${mk.slice(0,4)}</small><b class="out">${fmt(y.total)}</b></div><div><small>Từ khi ghi sổ</small><b class="out">${fmt(all.total)}</b></div></div>
    ${rows.length?`<div style="margin-top:10px">${rows.map(([k,v])=>`<div class="cat"><div class="t"><span>${esc(k)}</span><b>${fmt(v)}</b></div><div class="bar"><i style="width:${v/max*100}%;background:var(--red)"></i></div></div>`).join('')}</div>`
      :`<p class="hint">Chưa ghi khoản lãi nào. Ghi bằng nút <b>＋ Ghi lãi/phí</b> ở tab Tài khoản, hoặc chọn <b>Khác ▾ → Lãi & phí</b> khi ghi sổ. Nhập lãi mỗi kỳ cho trả góp để app tự cộng.</p>`}
    ${owe||loanLeftInt?`<p class="hint">${owe?`Nếu không trả hết dư nợ thẻ/trả sau, mỗi tháng mất thêm khoảng <b class="late">${fmt(owe)}</b> tiền lãi. `:''}${loanLeftInt?`Trả góp còn phải trả <b>${fmt(loanLeftInt)}</b> tiền lãi.`:''}</p>`:''}</div>`;
}

/* ---------- Tài khoản ---------- */
const loanIcon=n=>/điện thoại|iphone|phone|samsung/i.test(n)?'📱':/xe/i.test(n)?'🛵':/laptop|máy tính/i.test(n)?'💻':/tủ|máy giặt|tivi|tv|điều hòa/i.test(n)?'📺':'📆';
function donut(a,b){
  const tot=(a+b)||1,R=52,C=2*Math.PI*R,la=a/tot*C,lb=b/tot*C,gap=a&&b?4:0;
  const seg=(len,off,col,t)=>len?`<circle cx="70" cy="70" r="${R}" stroke="${col}" stroke-dasharray="${Math.max(0.1,len-gap)} ${C}" stroke-dashoffset="${-off}"><title>${t}</title></circle>`:'';
  return `<svg viewBox="0 0 140 140" width="132" height="132" role="img" aria-label="Đang có ${fmt(a)}, còn nợ ${fmt(b)}"><g transform="rotate(-90 70 70)" fill="none" stroke-width="16">
    <circle cx="70" cy="70" r="${R}" stroke="var(--bg)"/>${seg(la,0,'var(--green)','Đang có '+fmt(a))}${seg(lb,la,'var(--red)','Còn nợ '+fmt(b))}</g>
    <text x="70" y="64" text-anchor="middle" font-size="11" fill="var(--muted)">Có − Nợ</text><text x="70" y="84" text-anchor="middle" font-size="17" font-weight="800" fill="var(--text)">${fmtK(a-b)}</text></svg>`;
}
function arow(ic,name,sub,val,max,debt,extra,dragId){
  return `<div class="arow ${dragId?'drag':''}" ${dragId?`data-dragid="${dragId}"`:''}>${dragId?'<span class="dhandle" aria-label="Giữ và kéo để đổi vị trí" title="Giữ và kéo">⠿</span>':''}<div class="aic">${ic}</div><div class="bd"><div class="t"><b>${esc(name)}</b><b class="${debt?'out':val<0?'late':''}">${fmt(val)}</b></div>${sub?`<small class="muted">${sub}</small>`:''}<div class="bar"><i style="width:${max?Math.max(0,val)/max*100:0}%;background:var(--${debt?'red':'green'})"></i></div>${extra||''}</div></div>`;
}
/* Tiền lãi & phí: giao dịch danh mục "Lãi & phí" + phần lãi trong mỗi kỳ trả góp đã trả */
function interestIn(pre){
  const by={};let total=0;const add=(k,v)=>{if(!v)return;by[k]=(by[k]||0)+v;total+=v};
  state.tx.filter(t=>t.type==='expense'&&t.cat==='Lãi & phí'&&t.date.startsWith(pre)).forEach(t=>add(accName(t.acc),t.amount));
  state.loans.forEach(l=>{if(!l.interest)return;const n=state.tx.filter(t=>t.ref==='l:'+l.id&&t.date.startsWith(pre)).length;add('Trả góp '+l.name,n*l.interest)});
  return {total,by};
}
function viewAccounts(){
  const money=state.accounts.filter(a=>!isDebt(a)).map(a=>({a,v:bal(a.id)}));
  const T=today(),mk=T.slice(0,7),dueNow=dueItems(mk),dueOf=k=>dueNow.find(i=>i.key===k),monthInt=interestIn(mk).by,allInt=interestIn('').by;
  const dueLine=it=>it.done?`<div class="dline ok">✓ Đã trả ${it.st?'đủ '+fmt(it.ps):fmt(it.done.amount)} ngày ${dm(it.done.date)}</div>`
    :it.st&&it.ps?`<div class="dline ${it.date<T?'late':''}">📅 Đã trả ${fmt(it.ps)}/${fmt(it.st)} · còn thiếu <b>${fmt(it.amount)}</b> · ${it.date<T?'quá hạn từ':'hạn'} ${dm(it.date)}</div>`
    :`<div class="dline ${it.date<T?'late':''}">📅 Tháng này phải trả <b>${fmt(it.amount)}</b> · ${it.date<T?'quá hạn từ':'hạn'} ${dm(it.date)}</div>`;
  let dueSum=0;
  const debts=state.accounts.filter(a=>isDebt(a)).map(a=>{const v=Math.max(0,-bal(a.id)),it=dueOf('c:'+a.id),mi=monthInt[a.name]||0,ai=allInt[a.name]||0;
      if(it&&!it.done)dueSum+=it.amount;
      return {ic:accIcon(a),name:a.name,lim:a.limit||0,v,acc:a,
      sub:[ACC_TYPES[a.type],a.limit?`còn hạn mức <b class="${a.limit-v<a.limit*0.2?'late':''}">${fmtK(a.limit-v)}</b>/${fmtK(a.limit)}`:'',a.rate?`lãi ${String(a.rate).replace('.',',')}%/tháng`:''].filter(Boolean).join(' · '),
      extra:`<div class="dbox"><label class="stline"><span>🧾 Sao kê tháng ${+mk.slice(5)} phải thanh toán</span><input class="money" inputmode="numeric" data-st="${a.id}" value="${(a.stmt||{})[mk]?fmtN(a.stmt[mk]):''}" placeholder="Nhập số tiền"></label>        ${!a.dueDay?'<div class="dline muted">Đặt ngày đến hạn trả (nút ✏️) để app nhắc đúng hạn.</div>':''}
        ${it?dueLine(it)+(it.done&&v&&a.dueDay?`<div class="dline">📅 Kỳ sau phải trả <b>${fmt(v)}</b> · hạn ${String(a.dueDay).padStart(2,'0')}/${addMonths(mk,1).slice(5)}</div>`:''):v?`<div class="dline">${a.dueDay?'':'Chưa đặt ngày đến hạn trả · '}Dư nợ ${fmt(v)}</div>`:'<div class="dline ok">✓ Không còn dư nợ</div>'}

const FH={7:'1 tuần',30:'1 tháng',91:'1 quý'};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/864e5);
function forecast(days){
  const T=today(),end=addDays(T,days),cm=T.slice(0,7);
  const cash=state.accounts.filter(a=>!isDebt(a)).reduce((s,a)=>s+bal(a.id),0);
  const card=state.accounts.filter(a=>isDebt(a)).reduce((s,a)=>s+Math.max(0,-bal(a.id)),0);
  const from=state.startDate>addDays(T,-30)?state.startDate:addDays(T,-30),nd=Math.max(1,daysBetween(from,T));
  const past=state.tx.filter(t=>!t.ref&&isSpend(t)&&t.date>=from&&t.date<T);
  const vExp=sum(past)/nd;
  const from2=state.startDate>addDays(T,-90)?state.startDate:addDays(T,-90),nd2=Math.max(1,daysBetween(from2,T));
  const vInc=sum(state.tx.filter(t=>!t.ref&&t.type==='income'&&t.date>=from2&&t.date<T))/nd2;
  const left={};state.loans.forEach(l=>left[l.id]=loanLeft(l));
  const sched={};
  for(let mk=cm;mk<=end.slice(0,7);mk=addMonths(mk,1))for(const it of dueItems(mk)){
    if(it.done||it.type==='transfer'||it.date>end)continue;
    if(it.key.startsWith('l:')){const id=it.key.slice(2);if(!left[id])continue;left[id]--}
    const d=it.date<=T?addDays(T,1):it.date;
    (sched[d]=sched[d]||[]).push({v:it.type==='income'?it.amount:-it.amount,kind:it.key.startsWith('l:')?'loan':it.type==='income'?'inc':'fix',name:it.name});
  }
  let liq=cash-card;const start=liq,pts=[{d:T,v:liq}],tot={inc:0,fix:0,loan:0,vExp:0,vInc:0};let min={v:liq,d:T};
  for(let i=1;i<=days;i++){const d=addDays(T,i);liq+=vInc-vExp;tot.vInc+=vInc;tot.vExp+=vExp;(sched[d]||[]).forEach(s=>{liq+=s.v;tot[s.kind]+=Math.abs(s.v)});pts.push({d,v:liq});if(liq<min.v)min={v:liq,d}}
  const loanDebt=state.loans.reduce((s,l)=>s+left[l.id]*l.amount,0);
  const monthlyNeed=state.recurring.filter(r=>r.type==='expense').reduce((s,r)=>s+r.amount,0)+state.loans.filter(l=>left[l.id]>0).reduce((s,l)=>s+l.amount,0)+vExp*30;
  const byc={};past.forEach(t=>byc[t.cat]=(byc[t.cat]||0)+t.amount);const top=Object.entries(byc).sort((a,b)=>b[1]-a[1])[0];
  return {days,end,start,card,liq,min,pts,tot,vExp,nd,loanDebt,monthlyNeed,income:tot.inc+tot.vInc,spend:tot.fix+tot.loan+tot.vExp,top:top&&{cat:top[0],perDay:top[1]/nd}};
}
function health(f){
  const em=f.monthlyNeed?Math.max(0,f.liq)/f.monthlyNeed:0,sr=f.income?(f.income-f.spend)/f.income:-1;
  const lv=f.min.v<0?3:(f.liq<f.monthlyNeed*0.5?2:(em<3||sr<0.1?1:0));
  const L=[{t:'Tốt',ic:'✅',c:'green'},{t:'Ổn',ic:'🙂',c:'amber'},{t:'Cần chú ý',ic:'⚠️',c:'orange'},{t:'Nguy hiểm',ic:'⛔',c:'red'}][lv];
  const msg=[`Tiền dự kiến ${f.liq>=f.start?'tăng':'giảm'} còn ${fmt(f.liq)}, đủ chi tiêu khoảng ${em.toFixed(1)} tháng.`,
    `Vẫn đủ tiền chi tiêu, nhưng quỹ dự phòng mới được ${em.toFixed(1)} tháng${sr<0.1?' và gần như không để dành được':''}.`,
    `Cuối kỳ chỉ còn ${fmt(f.liq)}, chưa đủ nửa tháng chi tiêu.`,
    `Khoảng ngày ${dm(f.min.d)} tiền có thể âm ${fmt(-f.min.v)}, phải quẹt thẻ hoặc vay thêm.`][lv];
  return Object.assign({lv,em,sr,msg},L);
}
function lineChart(pts){
  const W=340,H=160,P={l:4,r:4,t:22,b:22},n=pts.length,vs=pts.map(p=>p.v);
  const vmin=Math.min(...vs),mn=Math.min(0,vmin),mx=Math.max(1,...vs),rg=Math.max(mx-vmin,mx*0.1),pad=rg*0.12;
  const lo=vmin<0?vmin-pad:Math.max(0,vmin-rg*0.5),hi=mx+pad;
  const x=i=>P.l+i/(n-1)*(W-P.l-P.r),y=v=>P.t+(hi-v)/(hi-lo)*(H-P.t-P.b);
  ui.fc={pts,x,y,W};
  const line=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join('');
  const y0=(mn<0?y(0):y(lo)).toFixed(1),mi=vs.indexOf(Math.min(...vs)),mid=Math.floor((n-1)/2);
  const lab=(i,anchor)=>`<text x="${x(i)}" y="${H-6}" text-anchor="${anchor}" font-size="10.5" fill="var(--muted)">${i?dm(pts[i].d):'Hôm nay'}</text>`;
  return `<div class="fc"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Dự báo tiền từ ${fmt(vs[0])} đến ${fmt(vs[n-1])}">
    <path d="${line}L${x(n-1)} ${y0}L${x(0)} ${y0}Z" fill="var(--accent)" opacity=".12"/>
    <line x1="0" x2="${W}" y1="${y0}" y2="${y0}" stroke="${mn<0?'var(--red)':'var(--line)'}" ${mn<0?'stroke-dasharray="4 3"':''}/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    ${vs[mi]<0?`<circle cx="${x(mi)}" cy="${y(vs[mi])}" r="4.5" fill="var(--red)" stroke="var(--card)" stroke-width="2"/>`:''}
    <circle cx="${x(n-1)}" cy="${y(vs[n-1])}" r="4.5" fill="var(--accent)" stroke="var(--card)" stroke-width="2"/>
    <text x="${x(0)}" y="${Math.max(12,y(vs[0])-8)}" font-size="11" fill="var(--muted)">${fmtK(vs[0])}</text>
    <text x="${x(n-1)}" y="${Math.max(12,y(vs[n-1])-8)}" text-anchor="end" font-size="11.5" font-weight="700" fill="var(--text)">${fmtK(vs[n-1])}</text>
    ${lab(0,'start')}${lab(mid,'middle')}${lab(n-1,'end')}
    <line class="cx" y1="${P.t-8}" y2="${H-P.b}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/><circle class="cd" r="4" fill="var(--accent)" stroke="var(--card)" stroke-width="2" visibility="hidden"/>
  </svg><div class="tip" hidden></div></div>`;
}
function viewForecast(){

  const get=u=>fetch(u,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});

  const ok=(p,test)=>p.status==='fulfilled'&&test(p.value);
  const n={t:Date.now(),err:{}};
  if(ok(g,v=>v.prices))n.gold=g.value.prices;else{n.gold=mkt.gold;n.err.gold=1}
  if(ok(x,v=>v.price))n.xau=x.value.price;else{n.xau=mkt.xau;n.err.gold=1}
  if(ok(f,v=>v.rates&&v.rates.VND))n.fx=f.value.rates;else{n.fx=mkt.fx;n.err.fx=1}
  if(ok(c,v=>v.bitcoin))n.coins=c.value;else{n.coins=mkt.coins;n.err.coins=1}

const CAT_GUESS=n=>/google|apple|icloud|a\.?i|chatgpt|claude|youtube|netflix|spotify/i.test(n)?'Đăng ký số':/nhà/i.test(n)?'Thuê nhà':/vợ/i.test(n)?'Vợ':/con|học|sữa/i.test(n)?'Con cái':/điện|nước|net|wifi|gas/i.test(n)?'Điện nước':/mua|shopee|lazada|tiki|siêu thị/i.test(n)?'Mua sắm':/ăn|chợ/i.test(n)?'Ăn uống':'Khác';
function finish(){
  const d=ui.draft;
  const accounts=d.accounts.filter(a=>a.name.trim()).map(a=>({id:a.id,name:a.name.trim(),type:a.type,brand:a.brand||'',opening:isDebt(a)?-(a.opening||0):(a.opening||0),limit:isDebt(a)?(a.limit||0):0,rate:isDebt(a)?(+a.rate||0):0,stmt:isDebt(a)&&a.stmt?a.stmt:undefined,dueDay:a.dueDay||0,payFrom:a.payFrom}));
  if(!accounts.length){toast('Cần ít nhất 1 tài khoản');return false}
  const ids=new Set(accounts.map(a=>a.id)),first=(accounts.find(a=>!isDebt(a))||accounts[0]).id,fix=id=>ids.has(id)?id:first;
  accounts.forEach(a=>{if(isDebt(a))a.payFrom=a.payFrom!==a.id&&ids.has(a.payFrom)?a.payFrom:first});
  const old=state&&state.setup?state:null,paidOf=id=>old?old.tx.filter(t=>t.ref==='l:'+id).length:0;
  const loans=d.loans.filter(l=>l.name.trim()&&l.amount>0&&l.remaining>0).map(l=>({id:l.id,name:l.name.trim(),amount:l.amount,interest:Math.min(l.interest||0,l.amount),day:l.day||1,remaining:l.remaining+paidOf(l.id),acc:fix(l.acc)}));
  const recurring=d.recurring.filter(r=>r.name.trim()&&(r.cur==='USD'?r.usd>0:r.amount>0)).map(r=>{const o={...r,name:r.name.trim(),day:r.day||1,acc:fix(r.acc),cat:r.cat||(r.type==='income'?'Thu khác':CAT_GUESS(r.name))};
    if(o.cur==='USD'){o.fee=feeOf(o);o.lastRate=usdRate()||o.lastRate||0;o.amount=recAmount(o)}else{o.cur='VND';o.usd=0}return o});
  state={v:2,setup:true,startDate:d.startDate||today(),accounts,loans,recurring,tx:old?old.tx:[]};
  persist();ui.draft=null;ui.view=old?'accounts':'today';ui.date=today();render();scrollTo(0,0);toast(old?'Đã lưu':'Xong! Bắt đầu ghi sổ thôi');return true;
}

  const I=uid,k={vcb:I(),tcb:I(),cc:I(),momo:I(),zalo:I(),shp:I(),vnp:I(),cash:I()};

  if(!finish())return;
  let seed=11;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647,pick=a=>a[Math.floor(rnd()*a.length)];
  let n=0;const add=(date,type,amount,cat,acc,note,x)=>state.tx.push(Object.assign({id:I(),ts:Date.now()+(n++),date,type,amount,cat,acc,note},x||{}));

  add(addDays(start,4),'transfer',500000,null,k.tcb,'Nạp MoMo',{toAcc:k.momo});
  add(addDays(start,13),'transfer',2000000,null,k.vcb,'Rút tiền mặt',{toAcc:k.cash});
  add(addDays(start,14),'transfer',500000,null,k.tcb,'Nạp MoMo',{toAcc:k.momo});
  add(addDays(start,9),'income',2500000,'Job ngoài',k.tcb,'Thiết kế cho khách');
  add(addDays(start,19),'income',1800000,'Job ngoài',k.tcb,'Làm thêm cuối tuần');
  for(let d=start;d<=T;d=addDays(d,1)){
    if(d===T)break;

    if(rnd()<.7)add(d,'expense',25000,'Ăn uống',k.momo,'Cà phê');
    add(d,'expense',pick([40000,45000,50000]),'Ăn uống',pick([k.cash,k.momo]),'Ăn trưa');
    if(rnd()<.4)add(d,'expense',pick([150000,220000,280000]),'Ăn uống',pick([k.cash,k.vcb]),'Đi chợ');
    if(parseD(d).getDay()===1)add(d,'expense',80000,'Khác',k.cash,'Đổ xăng');
    if(rnd()<.14)add(d,'expense',pick([185000,420000]),'Con cái',k.vcb,pick(['Sữa cho bé','Bỉm']));
  }
  const Y=addDays(T,-1);
  for(let mk=start.slice(0,7);mk<=T.slice(0,7);mk=addMonths(mk,1))for(const it of dueItems(mk))if(!it.done&&it.date<=Y)add(it.date,it.type,it.amount,it.cat,it.acc,it.name,{ref:it.key,toAcc:it.toAcc});
  persist();render();toast('Đã tạo dữ liệu mẫu');
}

document.addEventListener('touchend',e=>{
  if(!sw0)return;const p=e.changedTouches[0],dx=p.clientX-sw0.x,dy=p.clientY-sw0.y,dt=Date.now()-sw0.t;sw0=null;
  if(Math.abs(dx)<70||Math.abs(dx)<Math.abs(dy)*1.8||dt>800)return;
  const order=[...document.querySelectorAll('#tabs button')].map(b=>b.dataset.view),i=order.indexOf(ui.view==='settings'?'accounts':ui.view),j=i+(dx<0?1:-1);
  if(i>=0&&j>=0&&j<order.length)goTab(order[j],dx<0?1:-1);
},{passive:true});
document.addEventListener('pointermove',fcHover);document.addEventListener('pointerdown',fcHover);
document.addEventListener('pointerout',e=>{const svg=e.target.closest&&e.target.closest('.fc svg');if(svg&&!svg.contains(e.relatedTarget)){svg.querySelectorAll('.cx,.cd').forEach(n=>n.setAttribute('visibility','hidden'));svg.parentNode.querySelector('.tip').hidden=true}});
/* Cài như app: chạy offline + xin trình duyệt giữ dữ liệu lâu dài */
if('serviceWorker' in navigator&&location.protocol!=='file:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='amt'||e.target.id==='note')){e.preventDefault();ACT.save()}});
render();
if(ui.restoreY){const y=ui.restoreY;ui.restoreY=0;requestAnimationFrame(()=>scrollTo(0,y))}
/* Đồng bộ khi mở app, khi quay lại app và khi có mạng trở lại */
if(sync)scheduleSync(300);
/* Có khoản tính bằng USD thì tải tỷ giá mới khi mở app */
if(state&&state.recurring&&state.recurring.some(isUsd))setTimeout(()=>loadMarket(),500);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')scheduleSync(300)});
addEventListener('online',()=>scheduleSync(300));
</script>
</body>
</html>
